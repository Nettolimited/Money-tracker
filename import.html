// ===== BUILD DATA =====
function genId(i) {
  return (1700000000000 + i * 1000).toString(36) + Math.random().toString(36).slice(2, 6);
}

const transactions = RAW.map((r, i) => ({
  id:         genId(i),
  date:       r[0],
  type:       r[1],
  category:   r[2],
  amount:     r[3],
  account:    r[4],
  note:       r[5],
  createdAt:  new Date(r[0]).getTime() + i,
}));

const installments = INSTALLMENTS.map((inst, i) => ({
  id: genId(1000 + i),
  ...inst,
}));

const finalData = {
  transactions,
  categories:   DEFAULT_CATS,
  budgets:      BUDGETS,
  installments,
};

// ===== IMPORT =====
const box = document.getElementById('status');

function init() {
  const existing = localStorage.getItem('financeApp_v1');
  if (existing) {
    try {
      const old = JSON.parse(existing);
      if (old.transactions && old.transactions.length > 0) {
        box.innerHTML = `
          <div class="warn">⚠️ มีข้อมูลเดิม ${old.transactions.length} รายการในแอพ</div>
          <p>ต้องการทำอะไร?</p>
          <button onclick="doImport('replace')" style="display:block;width:100%;padding:12px;background:#FF1744;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px">🔄 แทนที่ข้อมูลเดิมทั้งหมด</button>
          <button onclick="doImport('merge')"   style="display:block;width:100%;padding:12px;background:#6C63FF;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">➕ รวมกับข้อมูลเดิม</button>`;
        return;
      }
    } catch(e) {}
  }
  doImport('replace');
}
init();

function doImport(mode) {
  let data = finalData;
  if (mode === 'merge') {
    try {
      const old = JSON.parse(localStorage.getItem('financeApp_v1'));
      data = {
        ...finalData,
        transactions: [...old.transactions, ...finalData.transactions],
        installments: [...(old.installments||[]), ...finalData.installments],
        budgets: { ...finalData.budgets, ...(old.budgets||{}) },
      };
    } catch(e) {}
  }
  localStorage.setItem('financeApp_v1', JSON.stringify(data));
  box.innerHTML = `
    <div class="count">${data.transactions.length}</div>
    <p>รายการ นำเข้าสำเร็จ! 🎉</p>
    <p style="font-size:13px;color:#9E9E9E">กำลังเปิดแอพ...</p>`;
  setTimeout(() => { window.location.href = 'index.html'; }, 1500);
}
